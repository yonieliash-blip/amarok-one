# Full local production-like stack (postgres + api + web).
# Copy .env.production.example to .env and set JWT secrets before running.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# Or from repo root:
#   pnpm docker:up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amarok
      POSTGRES_PASSWORD: amarok
      POSTGRES_DB: amarok_one
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amarok -d amarok_one"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://amarok:amarok@postgres:5432/amarok_one?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Local Docker defaults only — set strong secrets via .env for any shared environment.
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-minimum-32-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-docker-refresh-secret-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
