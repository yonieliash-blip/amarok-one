name: Submit AMAROK ONE iOS to TestFlight

# Retriggered after assigning the App Store Connect API key to EAS Submit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo project identity
        working-directory: apps/mobile
        run: |
          pnpm dlx eas-cli@24 whoami
          pnpm dlx eas-cli@24 project:info --non-interactive

      - name: Submit successful iOS build to App Store Connect
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@24 submit --platform ios --profile production --id b7ec2514-dd38-403a-a5e0-8e26cb35c222 --non-interactive --wait
