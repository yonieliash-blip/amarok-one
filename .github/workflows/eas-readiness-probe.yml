name: Identify EAS iOS build log format

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  inspect-ios-log-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identify and decode EAS build log
        working-directory: apps/mobile
        shell: bash
        run: |
          pnpm dlx eas-cli@24 build:view 7cbe3894-d059-4b8c-a0e5-4eeb218c3d70 --json > /tmp/eas-build.json
          python - <<'PY'
          import json
          import subprocess

          with open('/tmp/eas-build.json', encoding='utf-8') as f:
              url = json.load(f)['logFiles'][0]

          subprocess.run([
              'curl', '--fail', '--location', '--silent', '--show-error',
              '--compressed', url, '--output', '/tmp/eas-build.log'
          ], check=True)
          PY
          echo '=== FILE TYPE ==='
          file /tmp/eas-build.log || true
          echo '=== FIRST 32 BYTES ==='
          xxd -l 32 /tmp/eas-build.log || true
          echo '=== SIZE ==='
          wc -c /tmp/eas-build.log
          echo '=== RELEVANT STRINGS ==='
          strings -n 4 /tmp/eas-build.log | grep -iE -C 6 'error|failed|bundle javascript|unable to resolve|cannot find|syntaxerror|transformerror|metro|module not found|phasescriptexecution' | tail -n 400 || true
