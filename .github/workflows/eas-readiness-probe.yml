name: Inspect EAS iOS failure logs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  inspect-ios-build-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download failed EAS build log
        working-directory: apps/mobile
        shell: bash
        run: |
          pnpm dlx eas-cli@24 build:view 7cbe3894-d059-4b8c-a0e5-4eeb218c3d70 --json > /tmp/eas-build.json
          python - <<'PY'
          import json
          import urllib.request

          with open('/tmp/eas-build.json', encoding='utf-8') as f:
              build = json.load(f)
          url = build['logFiles'][0]
          with urllib.request.urlopen(url, timeout=30) as response:
              text = response.read().decode('utf-8', errors='replace')
          lines = text.splitlines()
          print('\n'.join(lines[-600:]))
          PY
