name: Start first AMAROK ONE iOS build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  first-ios-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo identity and linked project
        working-directory: apps/mobile
        run: |
          pnpm dlx eas-cli@24 whoami
          pnpm dlx eas-cli@24 project:info --non-interactive

      - name: Start first iOS store build
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@24 build --platform ios --profile production --non-interactive --no-wait
