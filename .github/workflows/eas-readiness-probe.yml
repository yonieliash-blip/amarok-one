name: Build AMAROK ONE iOS for TestFlight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify iOS staging release configuration
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://staging-api.amarok-ce.com
        run: pnpm run release:check:ios:staging

      - name: Verify Expo project identity
        working-directory: apps/mobile
        run: |
          pnpm dlx eas-cli@24 whoami
          pnpm dlx eas-cli@24 project:info --non-interactive

      - name: Build iOS store binary
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@24 build --platform ios --profile production --non-interactive
