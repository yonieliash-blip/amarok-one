name: Inspect EAS iOS failure logs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  inspect-ios-build-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract failed EAS build errors
        working-directory: apps/mobile
        shell: bash
        run: |
          pnpm dlx eas-cli@24 build:view 7cbe3894-d059-4b8c-a0e5-4eeb218c3d70 --json > /tmp/eas-build.json
          python - <<'PY'
          import gzip
          import json
          import urllib.request

          with open('/tmp/eas-build.json', encoding='utf-8') as f:
              build = json.load(f)

          with urllib.request.urlopen(build['logFiles'][0], timeout=30) as response:
              raw = response.read()

          if raw[:2] == b'\x1f\x8b':
              raw = gzip.decompress(raw)

          text = raw.decode('utf-8', errors='replace')
          lines = text.splitlines()
          needles = (
              'error', 'failed', 'bundle javascript', 'unable to resolve',
              'cannot find', 'syntaxerror', 'transformerror', 'metro',
              'module not found', 'command phasescriptexecution failed'
          )

          hits = [i for i, line in enumerate(lines) if any(n in line.lower() for n in needles)]
          printed = set()
          for i in hits:
              for j in range(max(0, i - 6), min(len(lines), i + 10)):
                  if j not in printed:
                      print(lines[j])
                      printed.add(j)
              print('---')
          print('=== FINAL 120 LINES ===')
          print('\n'.join(lines[-120:]))
          PY
