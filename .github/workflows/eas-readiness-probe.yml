name: Validate iOS entrypoint fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-readiness-probe.yml

permissions:
  contents: read

jobs:
  validate-ios-entrypoint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply proposed entrypoint fix only in runner
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/mobile/package.json')
          data = json.loads(path.read_text())
          data['main'] = 'index.js'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          cat > apps/mobile/index.js <<'EOF'
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      - name: Verify iOS JavaScript bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://staging-api.amarok-ce.com
        run: pnpm expo export:embed --eager --platform ios --dev false --bundle-output /tmp/main.jsbundle --assets-dest /tmp/amarok-assets

      - name: Mobile typecheck
        working-directory: apps/mobile
        run: pnpm run typecheck

      - name: Mobile tests
        working-directory: apps/mobile
        run: pnpm run test

      - name: Mobile lint
        working-directory: apps/mobile
        run: pnpm run lint
