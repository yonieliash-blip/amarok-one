name: Staging operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe Staging operation to run
        required: true
        type: choice
        default: status
        options:
          - status
          - logs
          - database_readiness
          - migration_preflight
          - customer_site_indexes_diagnostic
          - apply_tasks_and_customer_site_indexes
          - apply_customer_site_indexes
          - restart_web
          - deploy_api_and_migrate
          - apply_internal_messages_and_birthdays
          - operational_numbers_preflight
          - apply_customer_identifier_preservation
          - apply_technician_availability
          - apply_service_context_and_inspiration
          - apply_repair_order_reporting

permissions:
  contents: read

concurrency:
  group: staging-operations
  cancel-in-progress: false

jobs:
  operate:
    name: ${{ inputs.operation }} on Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Run safe operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes ubuntu@staging.amarok-ce.com \
            "OPERATION='$OPERATION' bash -s" <<'REMOTE'
            set -euo pipefail

            cd /home/ubuntu/amarok-one
            test "$(git branch --show-current)" = "main"

            compose() {
              sudo docker compose \
                --env-file infrastructure/staging/staging.env \
                -f infrastructure/staging/docker-compose.yml "$@"
            }

            case "$OPERATION" in
              status)
                compose config --quiet
                compose ps
                sudo docker system df
                curl --fail --show-error --retry 3 --retry-all-errors \
                  https://staging.amarok-ce.com/health
                curl --fail --show-error --retry 3 --retry-all-errors \
                  https://staging-api.amarok-ce.com/health
                ;;
              logs)
                compose logs --no-color --timestamps --tail 250 api web caddy
                ;;
              database_readiness)
                compose exec -T postgres sh -ec '
                  pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                  psql -v ON_ERROR_STOP=1 \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT current_database() AS database, now() AS checked_at;"
                '
                ;;
              migration_preflight)
                compose exec -T postgres sh -ec '
                  set -eu
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT migration_name, finished_at, rolled_back_at, applied_steps_count FROM \"_prisma_migrations\" WHERE migration_name = \$\$20260927220000_customer_sites\$\$;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT to_regclass(\$\$public.customer_sites\$\$) AS customer_sites_table;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT table_name, column_name, is_nullable FROM information_schema.columns WHERE table_schema = \$\$public\$\$ AND (table_name = \$\$customer_sites\$\$ OR (table_name IN (\$\$customer_contacts\$\$, \$\$equipment\$\$, \$\$service_calls\$\$) AND column_name = \$\$customerSiteId\$\$)) ORDER BY table_name, column_name;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT indexname FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_sites_organizationId_idx\$\$, \$\$customer_sites_customerId_deletedAt_idx\$\$, \$\$customer_contacts_customerSiteId_idx\$\$, \$\$equipment_organizationId_customerSiteId_idx\$\$, \$\$service_calls_organizationId_customerSiteId_idx\$\$) ORDER BY indexname;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT conname FROM pg_constraint WHERE conname IN (\$\$customer_sites_organizationId_fkey\$\$, \$\$customer_sites_customerId_fkey\$\$, \$\$customer_contacts_customerSiteId_fkey\$\$, \$\$equipment_customerSiteId_fkey\$\$, \$\$service_calls_customerSiteId_fkey\$\$) ORDER BY conname;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT COUNT(*) AS duplicate_active_customer_site_groups FROM (SELECT 1 FROM customer_sites WHERE \"deletedAt\" IS NULL GROUP BY \"customerId\", \"name\" HAVING COUNT(*) > 1) AS duplicates;"
                '
                ;;
              customer_site_indexes_diagnostic)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                compose exec -T postgres sh -ec '
                  set -eu
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT migration_name, finished_at, rolled_back_at FROM \"_prisma_migrations\" WHERE migration_name IN (\$\$20261001033000_tasks_module\$\$, \$\$20261001110000_customer_sites_missing_indexes\$\$) ORDER BY migration_name;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT to_regclass(\$\$public.tasks\$\$) AS tasks_table, to_regtype(\$\$public.\"TaskStatus\"\$\$) AS task_status_type, to_regtype(\$\$public.\"TaskPriority\"\$\$) AS task_priority_type;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT COUNT(*) AS duplicate_active_customer_site_groups FROM (SELECT 1 FROM customer_sites WHERE \"deletedAt\" IS NULL GROUP BY \"customerId\", \"name\" HAVING COUNT(*) > 1) AS duplicates;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT indexname FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_contacts_customerSiteId_idx\$\$) ORDER BY indexname;"
                '
                ;;
              apply_tasks_and_customer_site_indexes)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261001033000_tasks_module/migration.sql
                test -f apps/api/prisma/migrations/20261001110000_customer_sites_missing_indexes/migration.sql
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20260929082000_customer_site_contact_fields\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001033000_tasks_module\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001110000_customer_sites_missing_indexes\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_class WHERE oid = to_regclass(\$\$public.tasks\$\$);")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_type WHERE oid IN (to_regtype(\$\$public.\"TaskStatus\"\$\$), to_regtype(\$\$public.\"TaskPriority\"\$\$));")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM (SELECT 1 FROM customer_sites WHERE \"deletedAt\" IS NULL GROUP BY \"customerId\", \"name\" HAVING COUNT(*) > 1) AS duplicates;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_contacts_customerSiteId_idx\$\$);")" = "0"
                '
                compose build --no-cache api
                compose run --rm --no-deps --entrypoint sh api -ec 'prisma migrate deploy --schema=./prisma/schema.prisma'
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001033000_tasks_module\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001110000_customer_sites_missing_indexes\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_class WHERE oid = to_regclass(\$\$public.tasks\$\$);")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_type WHERE oid IN (to_regtype(\$\$public.\"TaskStatus\"\$\$), to_regtype(\$\$public.\"TaskPriority\"\$\$));")" = "2"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_constraint WHERE conname IN (\$\$tasks_organizationId_fkey\$\$, \$\$tasks_assignedToId_fkey\$\$, \$\$tasks_createdById_fkey\$\$, \$\$tasks_completedById_fkey\$\$);")" = "4"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$tasks_organizationId_assignedToId_status_idx\$\$, \$\$tasks_organizationId_dueAt_idx\$\$);")" = "2"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_contacts_customerSiteId_idx\$\$);")" = "2"
                '
                ;;
              apply_customer_site_indexes)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261001110000_customer_sites_missing_indexes/migration.sql
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001033000_tasks_module\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001110000_customer_sites_missing_indexes\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM (SELECT 1 FROM customer_sites WHERE \"deletedAt\" IS NULL GROUP BY \"customerId\", \"name\" HAVING COUNT(*) > 1) AS duplicates;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_contacts_customerSiteId_idx\$\$);")" = "0"
                '
                compose build --no-cache api
                compose run --rm --no-deps --entrypoint sh api -ec \
                  'prisma migrate deploy --schema=./prisma/schema.prisma'
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261001110000_customer_sites_missing_indexes\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$customer_sites_customerId_name_active_key\$\$, \$\$customer_contacts_customerSiteId_idx\$\$);")" = "2"
                '
                ;;
              restart_web)
                compose up -d --no-deps --force-recreate web
                curl --fail --show-error --retry 5 --retry-all-errors \
                  https://staging.amarok-ce.com/health
                ;;
              deploy_api_and_migrate)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                compose build --no-cache api
                compose up -d --no-deps --force-recreate api
                curl --fail --show-error --retry 12 --retry-all-errors \
                  https://staging-api.amarok-ce.com/health
                ;;
              apply_internal_messages_and_birthdays)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261002150000_internal_messages_and_birthdays/migration.sql
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261002150000_internal_messages_and_birthdays\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.direct_conversations\$\$) IS NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.direct_messages\$\$) IS NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = \$\$public\$\$ AND table_name = \$\$organization_members\$\$ AND column_name = \$\$birthDate\$\$;")" = "0"
                '
                compose build --no-cache api
                compose run --rm --no-deps --entrypoint sh api -ec \
                  'prisma migrate deploy --schema=./prisma/schema.prisma'
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261002150000_internal_messages_and_birthdays\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.direct_conversations\$\$) IS NOT NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.direct_messages\$\$) IS NOT NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = \$\$public\$\$ AND table_name = \$\$organization_members\$\$ AND column_name = \$\$birthDate\$\$;")" = "1"
                '
                compose up -d --no-deps --force-recreate api
                curl --fail --show-error --retry 12 --retry-all-errors \
                  https://staging-api.amarok-ce.com/health
                ;;
              operational_numbers_preflight)
                compose exec -T postgres sh -ec '
                  set -eu
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT migration_name, finished_at, rolled_back_at, applied_steps_count FROM \"_prisma_migrations\" WHERE migration_name IN (\$\$20261002040000_amarok_operational_numbers\$\$, \$\$20261003073000_preserve_imported_customer_identifiers\$\$) ORDER BY migration_name, finished_at NULLS LAST;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT COUNT(*) AS non_deleted_customers FROM customers WHERE \"deletedAt\" IS NULL;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT COUNT(*) AS imported_customers_with_source_identifier FROM customers WHERE \"deletedAt\" IS NULL AND \"morningClientId\" IS NOT NULL;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT COUNT(*) AS non_imported_customers_without_source_identifier FROM customers WHERE \"deletedAt\" IS NULL AND \"morningClientId\" IS NULL;"
                  psql -X -v ON_ERROR_STOP=1 -P pager=off \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c "SELECT indexname FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname = \$\$customers_organizationId_customerNumber_active_key\$\$;"
                '
                ;;
              apply_customer_identifier_preservation)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261003073000_preserve_imported_customer_identifiers/migration.sql
                compose build --no-cache api
                compose run --rm --no-deps --entrypoint sh api -ec \
                  'prisma migrate deploy --schema=./prisma/schema.prisma'
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261003073000_preserve_imported_customer_identifiers\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM customers WHERE \"deletedAt\" IS NULL AND \"morningClientId\" IS NOT NULL AND \"externalCustomerNumber\" IS DISTINCT FROM \"morningClientId\";")" = "0"
                '
                compose up -d --no-deps --force-recreate api
                curl --fail --show-error --retry 12 --retry-all-errors \
                  https://staging-api.amarok-ce.com/health
                ;;
              apply_technician_availability)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261003100000_technician_availability/migration.sql
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261003100000_technician_availability\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regtype(\$\$public.\"TechnicianAvailabilityStatus\"\$\$) IS NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.technician_availability\$\$) IS NULL;")" = "t"
                '
                compose build --no-cache api
                compose run --rm --no-deps --entrypoint sh api -ec \
                  'prisma migrate deploy --schema=./prisma/schema.prisma'
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name = \$\$20261003100000_technician_availability\$\$ AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "1"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regtype(\$\$public.\"TechnicianAvailabilityStatus\"\$\$) IS NOT NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.technician_availability\$\$) IS NOT NULL;")" = "t"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = \$\$public\$\$ AND indexname IN (\$\$technician_availability_organizationId_technicianId_date_key\$\$, \$\$technician_availability_organizationId_date_idx\$\$, \$\$technician_availability_organizationId_technicianId_date_idx\$\$);")" = "3"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM pg_constraint WHERE conname IN (\$\$technician_availability_organizationId_fkey\$\$, \$\$technician_availability_technicianId_fkey\$\$);")" = "2"
                '
                compose up -d --no-deps --force-recreate api web
                curl --fail --show-error --retry 12 --retry-all-errors \
                  https://staging-api.amarok-ce.com/health
                curl --fail --show-error --retry 12 --retry-all-errors \
                  https://staging.amarok-ce.com/health
                ;;
              apply_service_context_and_inspiration)
                git fetch --no-tags origin main
                git merge --ff-only origin/main
                test -f apps/api/prisma/migrations/20261003123000_service_call_one_off_context/migration.sql
                test -f apps/api/prisma/migrations/20261003124000_inspiration_module/migration.sql
                compose exec -T postgres sh -ec '
                  set -eu
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE migration_name IN (\$\$20261003123000_service_call_one_off_context\$\$, \$\$20261003124000_inspiration_module\$\$) AND finished_at IS NOT NULL AND rolled_back_at IS NULL;")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT is_nullable FROM information_schema.columns WHERE table_schema = \$\$public\$\$ AND table_name = \$\$service_calls\$\$ AND column_name = \$\$equipmentId\$\$;")" = "NO"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = \$\$public\$\$ AND table_name = \$\$service_calls\$\$ AND column_name IN (\$\$equipmentModel\$\$, \$\$equipmentLicensePlate\$\$, \$\$equipmentChassisNumber\$\$, \$\$purchaseOrderNumber\$\$);")" = "0"
                  test "$(psql -X -tA -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass(\$\$public.inspiration_quotes\$\$) IS NULL;")" = "t"
