name: Check EAS authentication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-eas-auth.yml

permissions:
  contents: read

jobs:
  eas-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Check EAS token availability
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EAS_AUTH=missing"
            exit 0
          fi
          cd apps/mobile
          pnpm dlx eas-cli@16 whoami
          echo "EAS_AUTH=available"
