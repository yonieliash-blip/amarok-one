name: Deploy staging web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "infrastructure/staging/**"
      - ".github/workflows/deploy-staging-web.yml"

permissions:
  contents: read

concurrency:
  group: deploy-staging-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy current main to Staging
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes ubuntu@staging.amarok-ce.com <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/amarok-one
            test "$(git branch --show-current)" = "main"
            git pull --ff-only origin main
            sudo docker compose \
              --env-file infrastructure/staging/staging.env \
              -f infrastructure/staging/docker-compose.yml \
              up -d --build --no-deps web
            curl --fail --show-error --retry 5 --retry-all-errors https://staging.amarok-ce.com/health
          REMOTE
