name: EAS iOS build list probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-build-list-probe.yml

permissions:
  contents: read

jobs:
  list-ios-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: List recent iOS EAS builds
        working-directory: apps/mobile
        run: pnpm dlx eas-cli@24 build:list --platform ios --limit 20 --json --non-interactive
